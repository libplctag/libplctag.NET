name: Update core binaries

on:

  workflow_dispatch:
    inputs:
      libplctag_core_version:
        required: true
        description: Version of libplctag core to download (e.g. 2.5.0)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup git user
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Pull in latest libplctag core binaries into repository
        env:
          VERSION: ${{ github.event.inputs.libplctag_core_version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid core version '$VERSION'" >&2; exit 1; }

          runtimes=src/libplctag.NativeImport/runtimes
          project=src/libplctag.NativeImport/libplctag.NativeImport.csproj

          # Usage: fetch <release asset suffix> <file in zip> <runtime identifier>
          fetch() {
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/core.zip" "https://github.com/libplctag/libplctag/releases/download/v$VERSION/libplctag_${VERSION}_$1.zip"
            mkdir -p "$runtimes/$3/native"
            unzip -p "$RUNNER_TEMP/core.zip" "$2" > "$runtimes/$3/native/$2"
            sha256sum "$runtimes/$3/native/$2"
          }

          fetch macos_x64       libplctag.dylib osx-x64
          fetch macos_aarch64   libplctag.dylib osx-arm64
          fetch ubuntu_x64      libplctag.so    linux-x64
          fetch ubuntu_x86      libplctag.so    linux-x86
          fetch ubuntu_armv7_hf libplctag.so    linux-arm
          fetch ubuntu_arm64    libplctag.so    linux-arm64
          fetch windows_x64     plctag.dll      win-x64
          fetch windows_x86     plctag.dll      win-x86
          fetch windows_arm64   plctag.dll      win-arm64

          # Record the bundled core version so it appears in the package version as build metadata (+core.x.y.z)
          sed -i "s|<LibplctagCoreVersion>[^<]*</LibplctagCoreVersion>|<LibplctagCoreVersion>$VERSION</LibplctagCoreVersion>|" "$project"

          git add "$runtimes" "$project"
          git commit -m "Updating to libplctag core v$VERSION"
          git push origin
