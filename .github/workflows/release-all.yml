name: Release all

on: [workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Build all and run tests
      run: dotnet test src/libplctag.sln --configuration Release

    - name: Pack
      run: dotnet pack src/libplctag.sln --configuration Release --no-build --output artifacts

    - name: NuGet login (OIDC to temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish all packages on version change
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        set -euo pipefail

        dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

        # Tag each version the first time it is released
        nativeimport_tag="libplctag.NativeImport-v$(dotnet msbuild src/libplctag.NativeImport/libplctag.NativeImport.csproj -getProperty:Version)"
        libplctag_tag="libplctag-v$(dotnet msbuild src/libplctag/libplctag.csproj -getProperty:Version)"

        [ -n "$(git ls-remote --tags origin "$nativeimport_tag")" ] || { git tag "$nativeimport_tag"; git push origin "$nativeimport_tag"; }
        [ -n "$(git ls-remote --tags origin "$libplctag_tag")" ] || { git tag "$libplctag_tag"; git push origin "$libplctag_tag"; }
